<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de recursos académicos · Ingeniería Aeroespacial UNLP</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{
  --bg:#252220; --paper:#2F2B27; --panel:#2A2622; --rail:#221F1C;
  --ink:#EEE8DD; --ink-muted:#9C9284; --ink-dim:#6F675C;
  --border:#453F37; --border-soft:#38332C;
  --accent:#E38358; --accent-dark:#F2A97D; --accent-soft:rgba(227,131,88,0.18);
  --cb:#5DADE2; --tb:#52BE80; --ta:#EC7063; --co:#F4D03F;
  --ok:#52BE80; --warn:#F4D03F; --err:#EC7063;
  --mono: "Cascadia Code","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif: "Iowan Old Style",ui-serif,Georgia,"Palatino Linotype",serif;
  --sans: "Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display: "Segoe UI Variable Display","Segoe UI",var(--sans);
  --fs:14px; --sidebar-w:300px;

  /* --- Escala tipográfica: 9 pasos, reemplaza 16 tamaños sueltos --- */
  --t-2xs:10px; --t-xs:11px;  --t-sm:12px;  --t-md:13px; --t-base:14px;
  --t-lg:16px;  --t-xl:20px;  --t-2xl:25px; --t-3xl:31px;

  /* --- Grilla de espacio: múltiplos de 4 --- */
  --sp-1:4px;  --sp-2:8px;  --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-14:56px; --sp-20:80px;

  /* --- Radios: 5 pasos, reemplaza 12 valores sueltos --- */
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-full:999px;

  /* --- Elevación en capas (tema oscuro) --- */
  --sh-1: 0 1px 2px rgba(0,0,0,.20), 0 1px 1px rgba(0,0,0,.12);
  --sh-2: 0 2px 4px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.22);
  --sh-3: 0 6px 14px rgba(0,0,0,.24), 0 18px 44px rgba(0,0,0,.32);
  --sh-4: 0 14px 30px rgba(0,0,0,.30), 0 34px 76px rgba(0,0,0,.44);

  /* --- Movimiento --- */
  --dur-1:120ms; --dur-2:200ms;
  --ease: cubic-bezier(.2,.6,.3,1);

  /* Dependencias en la Red de asignaturas: de dónde viene / a dónde abre paso */
  --dep-prereq:#FF3B30;

  /* --- Anillo de foco con hueco --- */
  --ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  /* Le avisa al navegador de qué tono es la página, para que dibuje en el mismo
     registro lo que no controla el CSS: el almanaque de los campos de fecha,
     los desplegables nativos y las barras de desplazamiento. */
  color-scheme: dark;
}
/* Los temas claros necesitan sombras mucho más tenues y frías */
html[data-theme="light"],html[data-theme="solar-light"],html[data-theme="dawn"]{
  color-scheme: light;
  --sh-1: 0 1px 2px rgba(60,45,30,.07);
  --sh-2: 0 1px 2px rgba(60,45,30,.06), 0 4px 12px rgba(60,45,30,.09);
  --sh-3: 0 4px 10px rgba(60,45,30,.08), 0 14px 34px rgba(60,45,30,.12);
  --sh-4: 0 10px 24px rgba(60,45,30,.11), 0 28px 64px rgba(60,45,30,.17);
}

}

  --accent:#29B6F6; --accent-dark:#4FC3F7; --accent-soft:rgba(41,182,246,0.16);
  --cb:#29B6F6; --tb:#66BB6A; --ta:#EF5350; --co:#FFCA28;
  --ok:#66BB6A; --warn:#FFCA28; --err:#EF5350;
}

  --bg:#2E3440; --paper:#3B4252; --panel:#353B49; --rail:#272C36;

  --cb:#81A1C1; --tb:#A3BE8C; --ta:#BF616A; --co:#EBCB8B;
  --ok:#A3BE8C; --warn:#EBCB8B; --err:#BF616A;

  --border:#1E4674; --border-soft:#173A62;

}

  --accent:#FFD400; --accent-dark:#FFE95C; --accent-soft:rgba(255,212,0,0.20);

  --border:#3D2F2A; --border-soft:#2F2420;
  --accent:#DC143C; --accent-dark:#FF1744; --accent-soft:rgba(220,20,60,0.18);
  --cb:#4FC3F7; --tb:#66BB6A; --ta:#EF5350; --co:#FDD835;
  --ok:#66BB6A; --warn:#FDD835; --err:#EF5350;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); font-size:var(--fs);
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* Números tabulares solo donde se comparan en columna, nunca en prosa */
.statusbar,.card .c-code,.node-row .code,.nb-gutter,.chip,.kbd,
code,kbd,pre,.mono,.p-item .p-sub{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.011em;
  text-wrap:balance;font-feature-settings:"liga","kern"}
p,li{text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-dark);text-decoration:none;
  text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration:underline}

/* --- Foco visible: un anillo con hueco, en TODO control interactivo --- */
:focus{outline:none}
:focus-visible,
[tabindex]:focus-visible,
.rail-btn:focus-visible,.icon-btn:focus-visible,.btn:focus-visible,
.card:focus-visible,.theme-card:focus-visible,
.node-row:focus-visible,.p-item:focus-visible{
  outline:none;box-shadow:var(--ring);border-radius:var(--r-sm);
  position:relative;z-index:2;
}
.search-input:focus-visible,.searchbar input:focus-visible,
select.ctl:focus-visible,input.ctl:focus-visible,textarea.ctl:focus-visible,
.palette input:focus-visible{
  box-shadow:none;border-color:var(--accent);
}

/* --- Estado deshabilitado --- */
[disabled],.is-disabled,button:disabled{
  opacity:.42;cursor:not-allowed;pointer-events:none;filter:saturate(.5);
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-full);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-dim);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--accent-soft);color:var(--ink)}

#app{display:flex;height:100vh;width:100vw}

.rail{
  width:52px;flex:0 0 52px;background:var(--rail);
  display:flex;flex-direction:column;align-items:center;padding:var(--sp-2) 0;gap:var(--sp-1);z-index:30;
}
.rail-btn{
  width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;
  color:var(--ink-dim);position:relative;
  transition:color var(--dur-1) var(--ease),background var(--dur-1) var(--ease);
}
.rail-btn:hover{color:var(--ink);background:var(--border-soft)}
/* Activo: una sola señal — la barra de acento. El color sigue, el fondo se va. */
.rail-btn.active{color:var(--accent-dark);background:transparent}
.rail-btn.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;
  width:3px;background:var(--accent);border-radius:0 var(--r-full) var(--r-full) 0}
.rail-btn svg{width:20px;height:20px;stroke-width:1.6}
.rail-spacer{flex:1}

.icon-btn{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink-muted);transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.icon-btn:hover{background:var(--border-soft);color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke-width:1.7}

/* --- Ventana del Explorador: arbol fijo + tablero --- */
.xp{position:absolute;inset:0;display:flex;overflow:hidden}
.xp-tree{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--dur-2) var(--ease),flex-basis var(--dur-2) var(--ease)}
.xp-tree-body{flex:1;overflow:auto;padding-bottom:var(--sp-5)}
.xp-h{padding:var(--sp-3) var(--sp-4) var(--sp-2);font-size:var(--t-2xs);
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-muted);
  display:flex;align-items:center;gap:var(--sp-2)}
.xp-h .blk-n{font-family:var(--mono);letter-spacing:0;font-weight:400;color:var(--ink-dim)}
.xp-h .acts{margin-left:auto;display:flex;gap:var(--sp-1);opacity:0;
  transition:opacity var(--dur-1) var(--ease)}
.xp-card:hover .acts,.xp-tree:hover .acts,.xp-h:focus-within .acts{opacity:1}

.xp-board{flex:1;overflow:auto;padding:var(--sp-6) var(--sp-8) var(--sp-14)}
.xp-lead{margin-bottom:var(--sp-5)}
.xp-lead h2{font-size:var(--t-2xl);letter-spacing:-.02em;line-height:1.2}
.xp-lead p{color:var(--ink-muted);font-size:var(--t-md);margin-top:var(--sp-1)}
.xp-cards{display:grid;gap:var(--sp-4);align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.xp-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);overflow:hidden;display:flex;flex-direction:column}
.xp-card>.xp-h{border-bottom:1px solid var(--border-soft);padding:var(--sp-2) var(--sp-3)}
.xp-card-body{padding:var(--sp-2) var(--sp-1) var(--sp-3);max-height:360px;overflow:auto}
.xp-card-body .search-wrap{padding:var(--sp-1) var(--sp-2) var(--sp-2)}
.xp-form{display:flex;flex-wrap:wrap;gap:var(--sp-1);padding:var(--sp-1) var(--sp-2) var(--sp-3)}
.xp-form .ctl{min-width:0;padding:var(--sp-1) var(--sp-2);font-size:var(--t-sm)}
.xp-form .btn{padding:var(--sp-1) var(--sp-3);font-size:var(--t-sm)}

/* Único destello del buscador: confirma dónde aterrizó el salto a párrafo. */
.search-hit{ animation: searchFlash 1.2s ease-out; border-radius:var(--r-sm) }
@keyframes searchFlash{ 0%{background:var(--accent-soft)} 100%{background:transparent} }

@media(max-width:900px){
  .xp{flex-direction:column}
  .xp-tree{width:auto;flex:0 0 42%}
  .xp-board{padding:var(--sp-5)}
}

/* --- Pendientes: la misma fila sirve en el panel y en la vista completa --- */
.td{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2);
  border-radius:var(--r-sm);cursor:pointer;
  transition:background var(--dur-1) var(--ease)}
.td:hover{background:var(--border-soft)}
.td-box{width:15px;height:15px;flex:0 0 15px;margin-top:2px;border-radius:var(--r-xs);
  border:1.5px solid var(--ink-dim);display:grid;place-items:center;color:transparent;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),
             color var(--dur-1) var(--ease)}
.td-box:hover{border-color:var(--accent)}
.td-box svg{width:9px;height:9px}
.td.done .td-box{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#1B1815)}
.td-t{flex:1;font-size:var(--t-md);line-height:1.45;min-width:0;overflow-wrap:anywhere}
.td.done .td-t{text-decoration:line-through;color:var(--ink-dim)}
.td-sub,.td-when{font-family:var(--mono);font-size:var(--t-2xs);color:var(--ink-dim);
  white-space:nowrap;flex:0 0 auto;margin-top:2px}
.td-when.late{color:var(--err);font-weight:600}
.td-when.soon{color:var(--warn)}
.td-add{margin-top:var(--sp-1)}
.td-del{opacity:0;flex:0 0 auto}
.td:hover .td-del{opacity:.6}
.td-del:hover{opacity:1}
.td.wide{padding:var(--sp-2) var(--sp-3);gap:var(--sp-3);align-items:center}
.td.wide .td-box{margin-top:0}
.td.wide .td-when,.td.wide .td-sub{margin-top:0}
.td-list{border:1px solid var(--border-soft);border-radius:var(--r-md);
  padding:var(--sp-1);background:var(--paper)}
.td-form{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;
  margin-top:var(--sp-5)}


.search-wrap{padding:var(--sp-1) var(--sp-3) var(--sp-3)}
.search-input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:var(--sp-2) var(--sp-3);font-size:var(--t-sm);outline:none;
  transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);
}
.search-input::placeholder{color:var(--ink-dim)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.tree{padding:0 var(--sp-2);font-size:var(--t-md);user-select:none}
.node-row{
  display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2);
  border-radius:var(--r-sm);cursor:pointer;
  white-space:nowrap;position:relative;color:var(--ink);
  transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);
}
.node-row:hover{background:var(--border-soft)}
.node-row.selected{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.node-row .chev{width:12px;height:12px;flex:0 0 12px;color:var(--ink-dim);
  transition:transform var(--dur-1) var(--ease)}
.node-row.open>.chev{transform:rotate(90deg)}
.node-row .ico{width:15px;height:15px;flex:0 0 15px}
.node-row .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.node-row .code{font-size:var(--t-2xs);font-family:var(--mono);color:var(--ink-dim);
  flex:0 0 auto;letter-spacing:.02em}
/* Chincheta: discreta hasta que pasás el cursor; siempre visible si está puesta */
.node-row .pin{width:14px;height:14px;flex:0 0 14px;color:var(--ink-dim);opacity:0;
  display:grid;place-items:center;
  transition:opacity var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.node-row .pin svg{width:13px;height:13px}
.node-row:hover .pin{opacity:.55}
.node-row .pin:hover{opacity:1;color:var(--ink)}
.node-row .pin.on{opacity:1;color:var(--accent-dark)}

.node-children{margin-left:var(--sp-3);border-left:1px solid var(--border-soft);padding-left:var(--sp-1)}
.node-children.hidden{display:none}

  background:var(--border-soft); overflow:hidden; margin-top:4px}
.nt-fill{height:100%; background:var(--accent); border-radius:var(--r-full);
  transition:width .4s var(--ease); width:0}

.nt-legend{
  display:flex; align-items:center; gap:var(--u); flex-wrap:wrap; flex:0 0 auto;
  padding:calc(var(--u)*.4) calc(var(--u)*1.25);
  background:var(--panel); border-bottom:1px solid var(--border-soft);
  font-size:calc(var(--u)*.7); color:var(--ink);
}
.nt-legend i{display:flex; align-items:center; gap:calc(var(--u)*.35); font-style:normal}
.nt-legend i::before{content:""; width:calc(var(--u)*.56); height:calc(var(--u)*.56);
  border-radius:3px; background:var(--c)}
.nt-hint{margin-left:auto; color:var(--ink-muted); font-size:calc(var(--u)*.66)}

.nt-scroll{position:relative; flex:1; overflow:auto; padding:calc(var(--u)*1.1) calc(var(--u)*1.25)}
.nt-lines{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1}
.nt-grid{display:flex; gap:calc(var(--u)*1.5); position:relative; z-index:2; min-width:max-content}

.nt-col{display:flex; flex-direction:column; gap:calc(var(--u)*.6);
  width:calc(var(--u)*12.25); position:relative}
.nt-col::before{content:""; position:absolute; inset:calc(var(--u)*-.45) calc(var(--u)*-.4);
  border-radius:calc(var(--u)*.9); background:var(--accent); opacity:0; pointer-events:none}
.nt-col.lit::before{animation:ntLit .7s ease-out}
@keyframes ntLit{0%{opacity:0} 22%{opacity:.24} 100%{opacity:0}}
.nt-col.lit .nt-sem{animation:ntLitHead .7s ease-out}
@keyframes ntLitHead{
  0%,100%{border-color:var(--border); color:var(--ink)}
  22%{border-color:var(--accent); color:var(--accent-dark)}
}
.nt-sem{text-align:center; padding:calc(var(--u)*.3) calc(var(--u)*.5);
  background:var(--paper); border:1px solid var(--border); border-radius:var(--r-full);
  font-size:calc(var(--u)*.72); font-weight:600; color:var(--ink); letter-spacing:.01em}

.nt-card{
  background:var(--paper); border:1px solid var(--border); border-left:4px solid var(--ta);
  border-radius:calc(var(--u)*.75); padding:calc(var(--u)*.5) calc(var(--u)*.6);
  cursor:pointer; position:relative; user-select:none;
  transition:transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease),
             border-color var(--dur-2) var(--ease);
}
.nt-card:hover{transform:translateY(-2px); box-shadow:var(--sh-3); border-color:var(--ink-muted)}
.nt-card.t-CB{border-left-color:var(--cb)} .nt-card.t-TB{border-left-color:var(--tb)}
.nt-card.t-TA{border-left-color:var(--ta)} .nt-card.t-CO{border-left-color:var(--co)}
.nt-code{font-size:calc(var(--u)*.63); font-weight:600; color:var(--ink-muted); display:flex;
  justify-content:space-between; margin-bottom:calc(var(--u)*.3);
  font-family:var(--mono); font-variant-numeric:tabular-nums}
.nt-chip{padding:0 calc(var(--u)*.35); border-radius:var(--r-xs); font-weight:700; letter-spacing:.04em}
.t-CB .nt-chip{background:var(--cb); color:var(--on-cb,#161310)}
.t-TB .nt-chip{background:var(--tb); color:var(--on-tb,#161310)}
.t-TA .nt-chip{background:var(--ta); color:var(--on-ta,#161310)}
.t-CO .nt-chip{background:var(--co); color:var(--on-co,#161310)}
.nt-name{font-family:var(--serif); font-size:calc(var(--u)*.8); font-weight:600;
  line-height:1.22; margin-bottom:calc(var(--u)*.3); color:var(--ink)}
.nt-meta{font-size:calc(var(--u)*.63); color:var(--ink-muted); display:flex;
  gap:calc(var(--u)*.5); flex-wrap:wrap}
.nt-meta .req{color:var(--accent-dark); font-weight:600}

.nt-card.passed::after{
  content:"\2713"; position:absolute; top:calc(var(--u)*-.4); right:calc(var(--u)*-.4);
  width:calc(var(--u)*1.2); height:calc(var(--u)*1.2); border-radius:var(--r-full);
  background:var(--accent); color:var(--on-accent,#1B1815);
  font-size:calc(var(--u)*.72); font-weight:700;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-2);
}
.nt-card.hl{border-color:var(--accent)!important; box-shadow:0 0 0 3px var(--accent-soft);
  transform:scale(1.03); z-index:5}
.nt-card.pre{border-color:var(--nt-prereq)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--nt-prereq) 22%,transparent); z-index:4}
.nt-card.post{border-color:var(--nt-unlocks)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--nt-unlocks) 22%,transparent); z-index:4}
.nt-card.dim{opacity:.3; filter:grayscale(50%)}

.nt-map{position:absolute; top:calc(var(--u)*-.4); left:calc(var(--u)*-.4);
  width:calc(var(--u)*1.2); height:calc(var(--u)*1.2); border-radius:var(--r-full);
  background:var(--panel); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--u)*.62); line-height:1; cursor:pointer; color:var(--ink-muted);
  box-shadow:var(--sh-1); z-index:6; transition:transform var(--dur-1) var(--ease)}
.nt-map:hover{transform:scale(1.15); border-color:var(--accent-dark)}
.nt-card.has-map .nt-map{background:var(--cb); border-color:var(--cb); color:var(--on-cb,#161310)}

/* --- Modo desbloqueo --- */
.nt-lock{position:absolute; inset:0; border-radius:inherit; background:#0B0B0B;
  display:none; z-index:3; flex-direction:column; align-items:center; justify-content:center;
  gap:calc(var(--u)*.3)}
.nt-card.locked .nt-lock{display:flex}
.nt-card.locked{cursor:default; border-left-color:#0B0B0B}
.nt-card.locked:hover{transform:none; box-shadow:none; border-color:var(--border)}
.nt-card.locked .nt-map{display:none}
.nt-lock b{font-size:calc(var(--u)*1.05); line-height:1; filter:grayscale(1); opacity:.75}
.nt-lock span{font-family:var(--mono); font-size:calc(var(--u)*.58); color:#8A8A8A;
  letter-spacing:.04em; text-align:center; padding:0 calc(var(--u)*.4); line-height:1.45}
@keyframes ntFlip{0%{transform:rotateY(0)} 50%{transform:rotateY(90deg)} 100%{transform:rotateY(0)}}
.nt-card.flip{animation:ntFlip .56s ease-in-out; z-index:7}

.nt-edge{fill:none; stroke:var(--ink-muted); stroke-width:1.4; opacity:.28;
  transition:stroke var(--dur-2) var(--ease), opacity var(--dur-2) var(--ease)}
.nt-edge.pre{stroke:var(--nt-prereq); stroke-width:2.2; opacity:.9}
.nt-edge.post{stroke:var(--nt-unlocks); stroke-width:2.2; opacity:.9}

.nt-tip{position:fixed; background:var(--paper); border:1px solid var(--border);
  padding:calc(var(--u)*.85) calc(var(--u)*.95); border-radius:var(--r-md);
  font-size:calc(var(--u)*.8); pointer-events:none; z-index:100; display:none;
  box-shadow:var(--sh-3); max-width:270px}
.nt-tip h4{color:var(--accent-dark); font-size:calc(var(--u)*.92); margin-bottom:calc(var(--u)*.4)}
.nt-tip p{margin-top:calc(var(--u)*.3); line-height:1.4; color:var(--ink)}
.nt-tip .none{color:var(--ink-muted)}
.nt-tip .l-pre{color:var(--nt-prereq)}
.nt-tip .l-post{color:var(--nt-unlocks)}

.nt-pop{position:fixed; z-index:110; display:none; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--r-md);
  padding:calc(var(--u)*.85) calc(var(--u)*.95); width:calc(var(--u)*15.5);
  box-shadow:var(--sh-4); font-size:calc(var(--u)*.76)}
.nt-pop.open{display:block}
.nt-pop h5{font-size:calc(var(--u)*.8); margin-bottom:calc(var(--u)*.55);
  color:var(--ink); font-family:var(--serif)}
.nt-pop label{display:flex; align-items:center; gap:calc(var(--u)*.4);
  margin-bottom:calc(var(--u)*.6); cursor:pointer; color:var(--ink-muted)}
.nt-pop input[type=checkbox]{accent-color:var(--accent); width:14px; height:14px}
.nt-pop input[type=text]{width:100%; background:var(--bg); border:1px solid var(--border-soft);
  border-radius:var(--r-sm); color:var(--ink); padding:calc(var(--u)*.4) calc(var(--u)*.5);
  font-size:calc(var(--u)*.72); margin-bottom:calc(var(--u)*.6)}
.nt-pop .hint{color:var(--ink-muted); font-size:calc(var(--u)*.68); line-height:1.4;
  margin-bottom:calc(var(--u)*.6)}
.nt-pop .acts{display:flex; gap:calc(var(--u)*.4); flex-wrap:wrap}
.nt-pop button{flex:1; border:1px solid var(--border); background:var(--bg); color:var(--ink);
  padding:calc(var(--u)*.4) calc(var(--u)*.5); border-radius:var(--r-sm); cursor:pointer;
  font-size:calc(var(--u)*.7)}
.nt-pop button.primary{background:var(--accent); color:var(--on-accent,#1B1815);
  border-color:var(--accent); font-weight:600}
.nt-pop button:hover{filter:brightness(1.12)}
</style>
</head>

</div></div>

<script src="data.js"></script>
