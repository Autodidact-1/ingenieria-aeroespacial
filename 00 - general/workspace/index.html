<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula · Ingeniería Aeroespacial UNLP</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{
  --bg:#252220; --paper:#2F2B27; --panel:#2A2622; --rail:#221F1C;
  --ink:#EEE8DD; --ink-muted:#9C9284; --ink-dim:#6F675C;
  --border:#453F37; --border-soft:#38332C;
  --accent:#E38358; --accent-dark:#F2A97D; --accent-soft:rgba(227,131,88,0.18);
  --cb:#8CADD1; --tb:#9AC086; --ta:#E38358; --co:#DCB259;
  --ok:#7FB584; --warn:#DCB259; --err:#DD7B5C;
  --mono: ui-monospace,"SF Mono",Menlo,"Cascadia Code",Consolas,monospace;
  --serif: ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans: ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --fs:14px; --sidebar-w:300px;
}
html[data-theme="light"]{
  --bg:#F5F1EA; --paper:#FFFDF9; --panel:#EFEAE1; --rail:#E6E0D5;
  --ink:#2A2620; --ink-muted:#6B6355; --ink-dim:#948B7C;
  --border:#D8D0C2; --border-soft:#E4DDD0;
  --accent:#C25E33; --accent-dark:#A44E27; --accent-soft:rgba(194,94,51,0.14);
  --cb:#3E6E9E; --tb:#4E8A44; --ta:#C25E33; --co:#A5822B;
  --ok:#3F7A46; --warn:#98761F; --err:#B4462B;
}
html[data-theme="slate"]{
  --bg:#1E2124; --paper:#26292D; --panel:#232629; --rail:#1A1D20;
  --ink:#E2E5E9; --ink-muted:#9AA1A9; --ink-dim:#6B7278;
  --border:#383D42; --border-soft:#2E3237;
  --accent:#7FB3D5; --accent-dark:#A6CDE8; --accent-soft:rgba(127,179,213,0.18);
  --cb:#7FB3D5; --tb:#8FC79A; --ta:#E0995E; --co:#D6C06A;
  --ok:#8FC79A; --warn:#D6C06A; --err:#E07A6A;
}
html[data-theme="midnight"]{
  --bg:#131A2B; --paper:#1B2438; --panel:#172032; --rail:#0F1523;
  --ink:#DCE3F0; --ink-muted:#8C97AF; --ink-dim:#616C85;
  --border:#2B3654; --border-soft:#222C44;
  --accent:#6C8CF5; --accent-dark:#9AB0FF; --accent-soft:rgba(108,140,245,0.20);
  --cb:#7FA9E8; --tb:#79C7A6; --ta:#F0A05A; --co:#E5C36B;
  --ok:#79C7A6; --warn:#E5C36B; --err:#F07A7A;
}
html[data-theme="nebula"]{
  --bg:#1A1524; --paper:#241D32; --panel:#1F1A2C; --rail:#150F1E;
  --ink:#EBE3F5; --ink-muted:#A093B8; --ink-dim:#726685;
  --border:#3B3050; --border-soft:#2E2640;
  --accent:#C77DFF; --accent-dark:#DDA6FF; --accent-soft:rgba(199,125,255,0.18);
  --cb:#7FC7E8; --tb:#86D9A8; --ta:#FF9EC4; --co:#FFC97A;
  --ok:#86D9A8; --warn:#FFC97A; --err:#FF7A9A;
}
html[data-theme="cockpit"]{
  --bg:#0F1110; --paper:#171A18; --panel:#131614; --rail:#0A0C0B;
  --ink:#D8E0D6; --ink-muted:#8A948A; --ink-dim:#5C655C;
  --border:#2A302B; --border-soft:#1F2420;
  --accent:#FFB020; --accent-dark:#FFC855; --accent-soft:rgba(255,176,32,0.16);
  --cb:#62C6C0; --tb:#7ED67E; --ta:#FFB020; --co:#E8D06A;
  --ok:#7ED67E; --warn:#E8D06A; --err:#FF6B5A;
}
html[data-theme="forest"]{
  --bg:#14201C; --paper:#1C2A25; --panel:#182420; --rail:#0F1915;
  --ink:#DFEAE3; --ink-muted:#93A79C; --ink-dim:#667A70;
  --border:#2E4238; --border-soft:#24352D;
  --accent:#5FD3A3; --accent-dark:#8CE5C0; --accent-soft:rgba(95,211,163,0.16);
  --cb:#7FBBD9; --tb:#9AD98A; --ta:#E7A05C; --co:#E0C670;
  --ok:#9AD98A; --warn:#E0C670; --err:#E8776A;
}
html[data-theme="nordic"]{
  --bg:#2E3440; --paper:#3B4252; --panel:#353B49; --rail:#272C36;
  --ink:#ECEFF4; --ink-muted:#A9B1C0; --ink-dim:#7A8496;
  --border:#4C566A; --border-soft:#414A5A;
  --accent:#88C0D0; --accent-dark:#A9D6E5; --accent-soft:rgba(136,192,208,0.18);
  --cb:#81A1C1; --tb:#A3BE8C; --ta:#D08770; --co:#EBCB8B;
  --ok:#A3BE8C; --warn:#EBCB8B; --err:#BF616A;
}
html[data-theme="blueprint"]{
  --bg:#0C2340; --paper:#123055; --panel:#0F2A4A; --rail:#081B31;
  --ink:#E6F1FF; --ink-muted:#93B0CE; --ink-dim:#6485A6;
  --border:#1E4674; --border-soft:#173A62;
  --accent:#FFD166; --accent-dark:#FFE099; --accent-soft:rgba(255,209,102,0.16);
  --cb:#7FC8F8; --tb:#8FE0B0; --ta:#FFD166; --co:#F0A868;
  --ok:#8FE0B0; --warn:#F0A868; --err:#FF8080;
}
html[data-theme="solar-dark"]{
  --bg:#002B36; --paper:#073642; --panel:#06303B; --rail:#00212B;
  --ink:#D8D3C3; --ink-muted:#93A1A1; --ink-dim:#6C8085;
  --border:#14454F; --border-soft:#0D3B45;
  --accent:#CB4B16; --accent-dark:#F08A55; --accent-soft:rgba(203,75,22,0.22);
  --cb:#268BD2; --tb:#9BB300; --ta:#CB4B16; --co:#B58900;
  --ok:#9BB300; --warn:#B58900; --err:#DC322F;
}
html[data-theme="solar-light"]{
  --bg:#FDF6E3; --paper:#FFFCF2; --panel:#F3ECD8; --rail:#EEE7D3;
  --ink:#073642; --ink-muted:#586E75; --ink-dim:#93A1A1;
  --border:#DDD5BE; --border-soft:#E9E1CB;
  --accent:#CB4B16; --accent-dark:#A03A10; --accent-soft:rgba(203,75,22,0.14);
  --cb:#268BD2; --tb:#5F7A00; --ta:#CB4B16; --co:#916A00;
  --ok:#5F7A00; --warn:#916A00; --err:#DC322F;
}
html[data-theme="dawn"]{
  --bg:#FFF6F2; --paper:#FFFFFF; --panel:#FBEBE4; --rail:#F6E2D9;
  --ink:#3A2A26; --ink-muted:#7C6259; --ink-dim:#A78C82;
  --border:#EAD3C8; --border-soft:#F3E2DA;
  --accent:#D4614A; --accent-dark:#B04532; --accent-soft:rgba(212,97,74,0.13);
  --cb:#3E7CA8; --tb:#4E8A5B; --ta:#D4614A; --co:#B07E22;
  --ok:#3F7A46; --warn:#98761F; --err:#B4462B;
}
html[data-theme="contrast"]{
  --bg:#000000; --paper:#0D0D0D; --panel:#121212; --rail:#000000;
  --ink:#FFFFFF; --ink-muted:#C9C9C9; --ink-dim:#9A9A9A;
  --border:#5A5A5A; --border-soft:#3A3A3A;
  --accent:#FFD400; --accent-dark:#FFE95C; --accent-soft:rgba(255,212,0,0.20);
  --cb:#66C2FF; --tb:#6EE07A; --ta:#FFD400; --co:#FFA23E;
  --ok:#6EE07A; --warn:#FFA23E; --err:#FF6B6B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); font-size:var(--fs);
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-dark);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-dim);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh;width:100vw}

.rail{
  width:52px;flex:0 0 52px;background:var(--rail);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:30;
}
.rail-btn{
  width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-dim);position:relative;transition:color .15s,background .15s;
}
.rail-btn:hover{color:var(--ink)}
.rail-btn.active{color:var(--accent-dark);background:var(--accent-soft)}
.rail-btn.active::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:2px;background:var(--accent);border-radius:2px}
.rail-btn svg{width:21px;height:21px;stroke-width:1.6}
.rail-spacer{flex:1}

.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--panel);
  border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;
}
.sidebar.collapsed{display:none}
.side-head{
  padding:12px 14px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-muted);display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.side-head .acts{display:flex;gap:2px}
.icon-btn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink-muted)}
.icon-btn:hover{background:var(--border-soft);color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke-width:1.7}
.side-body{flex:1;overflow:auto;padding:0 0 20px}

.search-wrap{padding:6px 12px 10px}
.search-input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;font-size:12.5px;outline:none;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.tree{padding:0 6px;font-size:13px;user-select:none}
.node-row{
  display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;
  white-space:nowrap;position:relative;color:var(--ink);
}
.node-row:hover{background:var(--border-soft)}
.node-row.selected{background:var(--accent-soft);color:var(--accent-dark)}
.node-row .chev{width:12px;height:12px;flex:0 0 12px;color:var(--ink-dim);transition:transform .12s}
.node-row.open>.chev{transform:rotate(90deg)}
.node-row .ico{width:15px;height:15px;flex:0 0 15px}
.node-row .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.node-row .code{font-size:10px;font-family:var(--mono);color:var(--ink-dim);flex:0 0 auto}
.node-children{margin-left:11px;border-left:1px solid var(--border-soft);padding-left:3px}
.node-children.hidden{display:none}
.tree-empty{padding:4px 12px;font-size:11.5px;color:var(--ink-dim);font-style:italic}
.dot{width:6px;height:6px;border-radius:99px;flex:0 0 6px}
.dot.CB{background:var(--cb)} .dot.TB{background:var(--tb)}
.dot.TA{background:var(--ta)} .dot.CO{background:var(--co)}

.editor{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabbar{
  display:flex;align-items:stretch;background:var(--rail);border-bottom:1px solid var(--border-soft);
  overflow-x:auto;overflow-y:hidden;min-height:37px;
}
.tabbar::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;max-width:230px;
  border-right:1px solid var(--border-soft);color:var(--ink-muted);font-size:12.5px;
  cursor:pointer;white-space:nowrap;position:relative;
}
.tab:hover{background:var(--panel)}
.tab.active{background:var(--bg);color:var(--ink)}
.tab.active::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.tab .name{overflow:hidden;text-overflow:ellipsis}
.tab .x{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;flex:0 0 17px;opacity:.5}
.tab .x:hover{background:var(--border);opacity:1}
.tab svg.ftype{width:14px;height:14px;flex:0 0 14px}

.viewport{flex:1;overflow:auto;position:relative}
.statusbar{
  height:24px;background:var(--rail);border-top:1px solid var(--border-soft);
  display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11px;color:var(--ink-muted);
  font-family:var(--mono);
}
.statusbar .sb-item{display:flex;align-items:center;gap:5px}
.sb-dot{width:7px;height:7px;border-radius:99px;background:var(--err)}
.sb-dot.on{background:var(--ok)}

.welcome{max-width:780px;margin:0 auto;padding:60px 32px}
.welcome h1{font-size:30px;letter-spacing:-.02em}
.welcome .sub{color:var(--ink-muted);margin-top:6px;font-size:14px}
.wcols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:38px}
.wcols h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);
  font-family:var(--sans);font-weight:600;margin-bottom:12px}
.wlist{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.wlist a{cursor:pointer}
.kbd{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-muted)}
.wsteps{margin-top:34px;padding:16px 18px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;font-size:13px;line-height:1.7;color:var(--ink-muted)}
.wsteps b{color:var(--ink)}
.wsteps code{font-family:var(--mono);background:var(--bg);padding:1px 6px;border-radius:5px;
  border:1px solid var(--border-soft);color:var(--accent-dark);font-size:12px}

.doc{max-width:860px;margin:0 auto;padding:40px 44px 120px;line-height:1.72;font-size:15px}
.doc h1{font-size:27px;margin:.2em 0 .55em;letter-spacing:-.015em}
.doc h2{font-size:21px;margin:1.5em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--border-soft)}
.doc h3{font-size:17px;margin:1.35em 0 .45em}
.doc h4{font-size:15px;margin:1.2em 0 .4em;color:var(--ink-muted)}
.doc p{margin:.75em 0}
.doc ul,.doc ol{margin:.7em 0 .7em 1.5em}
.doc li{margin:.28em 0}
.doc blockquote{border-left:3px solid var(--accent);background:var(--panel);
  padding:.6em 1em;margin:1em 0;border-radius:0 8px 8px 0;color:var(--ink-muted)}
.doc code{font-family:var(--mono);font-size:.87em;background:var(--panel);
  border:1px solid var(--border-soft);border-radius:5px;padding:1px 5px}
.doc pre{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;overflow:auto;margin:1em 0}
.doc pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.6}
.doc table{border-collapse:collapse;margin:1.1em 0;width:100%;font-size:13.5px}
.doc th,.doc td{border:1px solid var(--border);padding:7px 11px;text-align:left}
.doc th{background:var(--panel);font-weight:600}
.doc hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.doc img{max-width:100%;border-radius:8px}
.doc .math{font-family:var(--mono);color:var(--accent-dark);background:var(--accent-soft);
  padding:0 4px;border-radius:4px;font-size:.9em}
.doc .math-block{display:block;text-align:center;font-family:var(--mono);color:var(--accent-dark);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin:1.1em 0;
  overflow-x:auto;font-size:13.5px}

/* --- KaTeX: hereda el color del tema activo --- */
.katex{color:var(--ink);font-size:1.06em}
.katex-display{margin:1.15em 0;padding:2px 0;overflow-x:auto;overflow-y:hidden}
.katex-display>.katex{color:var(--ink)}
.katex .mord.text,.katex .mtext{color:var(--ink)}
.tex-error{color:var(--err);font-family:var(--mono);font-size:.86em;
  background:var(--panel);border:1px solid var(--err);border-radius:5px;padding:1px 5px;cursor:help}
.math-src{font-family:var(--mono);font-size:.87em;color:var(--accent-dark);
  background:var(--accent-soft);border-radius:4px;padding:0 4px}
.math-src-block{display:block;text-align:center;font-family:var(--mono);color:var(--accent-dark);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;
  margin:1.1em 0;overflow-x:auto;font-size:13.5px}

.frame{width:100%;height:100%;border:none;background:#fff;display:block}
.frame.dark{background:var(--bg)}
.img-view{display:grid;place-items:center;min-height:100%;padding:30px;background:var(--panel)}
.img-view img{max-width:100%;max-height:calc(100vh - 150px);border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}

.nb{max-width:960px;margin:0 auto;padding:32px 30px 120px}
.nb-cell{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.nb-gutter{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);width:58px;
  flex:0 0 58px;text-align:right;padding-top:14px}
.nb-body{flex:1;min-width:0}
.nb-src{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--cb);
  border-radius:8px;padding:11px 14px;overflow:auto;font-family:var(--mono);
  font-size:12.5px;line-height:1.6;white-space:pre}
.nb-out{background:var(--bg);border:1px solid var(--border-soft);border-left:3px solid var(--border);
  border-radius:8px;padding:9px 14px;margin-top:6px;font-family:var(--mono);font-size:12px;
  line-height:1.55;white-space:pre-wrap;overflow:auto;color:var(--ink-muted)}
.nb-out.err{border-left-color:var(--err);color:var(--err)}
.nb-out img{max-width:100%;background:#fff;border-radius:6px;padding:6px}

.pane{padding:30px 34px 90px;max-width:1180px;margin:0 auto}
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  flex-wrap:wrap;margin-bottom:6px}
.pane h1{font-size:24px;letter-spacing:-.015em}
.pane .lead{color:var(--ink-muted);font-size:13.5px;margin-top:4px;max-width:660px;line-height:1.6}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);
  font-family:var(--sans);font-weight:600;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border-soft)}

.grid{display:grid;gap:12px}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.card{
  background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:13px 15px;
  transition:border-color .15s,transform .15s,box-shadow .15s;cursor:pointer;position:relative;
}
.card:hover{border-color:var(--ink-dim);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.card.flat{cursor:default}
.card.flat:hover{transform:none;box-shadow:none;border-color:var(--border)}
.card .c-code{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);
  display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.card .c-name{font-size:13.5px;font-weight:600;line-height:1.35}
.card .c-meta{font-size:11.5px;color:var(--ink-muted);margin-top:8px;display:flex;
  gap:7px;flex-wrap:wrap;align-items:center}
.card.bl-CB{border-left:3px solid var(--cb)} .card.bl-TB{border-left:3px solid var(--tb)}
.card.bl-TA{border-left:3px solid var(--ta)} .card.bl-CO{border-left:3px solid var(--co)}
.chip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;color:#1E1B18;font-family:var(--mono)}
.chip.CB{background:var(--cb)} .chip.TB{background:var(--tb)}
.chip.TA{background:var(--ta)} .chip.CO{background:var(--co)}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);
  color:var(--ink-muted);background:var(--bg);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok)}
.pill.off{border-color:var(--border);color:var(--ink-dim)}

.btn{
  padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--paper);
  font-size:12.5px;transition:all .15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--ink-dim);background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#221F1C;font-weight:600}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn svg{width:14px;height:14px;stroke-width:1.8}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:14px 0;border-bottom:1px solid var(--border-soft)}
.set-row.stack{flex-direction:column;align-items:stretch;gap:14px}
.set-row .k{font-size:13.5px;font-weight:600}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.theme-card{border:1px solid var(--border);border-radius:11px;padding:9px 10px 10px;cursor:pointer;
  background:var(--paper);transition:border-color .15s,transform .15s;text-align:left}
.theme-card:hover{border-color:var(--ink-dim);transform:translateY(-2px)}
.theme-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-prev{height:46px;border-radius:7px;overflow:hidden;display:flex;border:1px solid rgba(0,0,0,.22)}
.theme-prev .p-rail{width:13px;flex:0 0 13px}
.theme-prev .p-side{width:34px;flex:0 0 34px}
.theme-prev .p-main{flex:1;padding:7px 6px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.theme-prev .bar{height:4px;border-radius:99px}
.theme-name{font-size:12.5px;font-weight:600;margin-top:8px}
.theme-note{font-size:10.5px;color:var(--ink-muted);margin-top:2px;line-height:1.4}
.set-row .d{font-size:12px;color:var(--ink-muted);margin-top:3px;max-width:540px;line-height:1.55}
.set-ctl{flex:0 0 auto;display:flex;gap:8px;align-items:center}
select.ctl,input.ctl{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:12.5px;outline:none;min-width:160px}
select.ctl:focus,input.ctl:focus{border-color:var(--accent)}
.switch{width:38px;height:21px;border-radius:99px;background:var(--border);position:relative;
  transition:background .18s;flex:0 0 38px;cursor:pointer}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;
  border-radius:99px;background:var(--ink-muted);transition:all .18s}
.switch.on{background:var(--accent)}
.switch.on::after{left:19.5px;background:#fff}

.graph-wrap{position:relative;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;margin-top:14px}
.graph-wrap svg{display:block;width:100%;height:auto;aspect-ratio:1100/640}
.g-node{cursor:pointer}
.g-node circle{transition:stroke-width .15s}
.g-node:hover circle{stroke-width:3}
.g-node text{font-size:9.5px;fill:var(--ink);pointer-events:none;font-family:var(--sans)}
.g-node.dim{opacity:.15}
.g-edge{stroke:var(--ink-dim);stroke-opacity:.42;stroke-width:1;fill:none;transition:opacity .15s,stroke .15s}
.g-edge.hot{stroke:var(--accent);stroke-width:2}
.g-edge.dim{opacity:.06}
.g-legend{position:absolute;left:14px;bottom:14px;display:flex;gap:11px;flex-wrap:wrap;
  background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:11px}
.g-legend .li{display:flex;align-items:center;gap:6px;color:var(--ink-muted);cursor:pointer}
.g-legend .li .sw{width:9px;height:9px;border-radius:99px}
.g-tip{position:absolute;background:var(--paper);border:1px solid var(--border);border-radius:9px;
  padding:8px 11px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .12s;
  max-width:250px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
.g-tip.show{opacity:1}

.book{display:flex;gap:12px;align-items:flex-start}
.book-cover{width:44px;height:60px;flex:0 0 44px;border-radius:5px;background:var(--panel);
  border:1px solid var(--border);display:grid;place-items:center;overflow:hidden}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover svg{width:19px;height:19px;color:var(--ink-dim)}
.book-info{min-width:0;flex:1}
.book-title{font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-author{font-size:11.5px;color:var(--ink-muted);margin-top:3px}
.book-tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.searchbar{display:flex;gap:8px;margin-top:14px}
.searchbar input{flex:1;background:var(--paper);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:13.5px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.loading{padding:26px;text-align:center;color:var(--ink-muted);font-size:13px}
.empty{padding:34px;text-align:center;color:var(--ink-dim);font-size:13px;font-style:italic}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding-top:12vh}
.overlay.show{display:flex}
.palette{width:min(640px,92vw);background:var(--paper);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
.palette input{width:100%;background:none;border:none;border-bottom:1px solid var(--border);
  padding:15px 18px;font-size:15px;outline:none}
.palette-list{max-height:52vh;overflow:auto;padding:6px}
.p-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.p-item.sel{background:var(--accent-soft)}
.p-item .p-sub{color:var(--ink-dim);font-size:11px;font-family:var(--mono);margin-left:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.p-item svg{width:15px;height:15px;flex:0 0 15px;color:var(--ink-muted)}

.toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:10px 18px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:all .22s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){
  .sidebar{position:absolute;left:52px;top:0;bottom:0;z-index:25;box-shadow:8px 0 24px rgba(0,0,0,.35)}
  .wcols{grid-template-columns:1fr}
  .doc{padding:26px 20px 90px}
  .pane{padding:22px 18px 80px}
}
</style>
</head>
